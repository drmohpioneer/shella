<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Shella</title>
<meta name="description" content="Split group expenses with your crew. No signup.">
<meta name="theme-color" content="#06202c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shella">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06202c; --bg2:#0b3a4a; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.12); --text:#eef8f9; --muted:#8fb4bc;
  --teal:#2ee6c9; --coral:#ff7a59; --sun:#ffc861; --green:#45e38f; --red:#ff5d73;
  --r:22px; --head:"Baloo 2","Baloo Bhaijaan 2",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:Outfit,"Baloo Bhaijaan 2",system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(120% 60% at 50% 0%,#0f5566 0%,var(--bg2) 35%,var(--bg) 75%) fixed,var(--bg);
  padding-bottom:120px;overflow-x:hidden;
}
[dir=rtl] body{font-family:"Baloo Bhaijaan 2",Outfit,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hide{display:none!important}

/* hero */
.hero{position:relative;padding:calc(env(safe-area-inset-top) + 18px) 0 70px;overflow:hidden}
.hero .sun{position:absolute;width:260px;height:260px;border-radius:50%;inset-inline-end:-70px;top:-60px;
  background:radial-gradient(circle,#ffe7a8 0%,#ffc861 35%,rgba(255,122,89,.45) 60%,transparent 72%);filter:blur(2px);opacity:.85}
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;gap:10px}
.brand{font-family:var(--head);font-weight:800;font-size:26px;letter-spacing:.2px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--sun)}
.me{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);
  padding:4px 12px 4px 4px;border-radius:99px;font-weight:600;font-size:14px;flex-shrink:0;max-width:52%}
.me .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} /* a long name must not push the trip name out of the header */
[dir=rtl] .me{padding:4px 4px 4px 12px}
.me img{width:34px;height:34px;border-radius:50%;background:var(--c)}
.homebtn{width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:19px;flex-shrink:0;display:grid;place-items:center}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
.ipay.pay{font-size:13px;font-weight:700;padding:7px 12px;white-space:nowrap;text-decoration:none;color:#032a25;background:var(--teal)}
.banner .later{background:var(--card2);color:var(--text)}
.total-wrap{position:relative;text-align:center;margin-top:26px}
.total-label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:2.5px}
.total{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:64px;line-height:1;margin-top:6px;direction:ltr;
  background:linear-gradient(180deg,#fff 20%,#ffd98e);-webkit-background-clip:text;background-clip:text;color:transparent}
.total small{font-size:22px;color:var(--sun);-webkit-text-fill-color:var(--sun);margin-left:4px}
.sub{color:var(--muted);margin-top:8px;font-size:14px}
.crew{display:flex;justify-content:center;margin-top:16px;flex-wrap:wrap;direction:ltr}
.crew img{width:52px;height:52px;border-radius:50%;background:var(--c);border:3px solid var(--bg2);margin-left:-12px;
  animation:bob 3s ease-in-out infinite}
.crew img:first-child{margin-left:0}
.crew img:nth-child(4n+2){animation-delay:.4s}.crew img:nth-child(4n+3){animation-delay:.8s}.crew img:nth-child(4n){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-5px)}}
.waves{position:absolute;left:0;right:0;bottom:0;height:60px}
.waves svg{position:absolute;bottom:0;width:100%;height:60px}

/* sections */
section{margin-top:26px}
h2{font-family:var(--head);font-size:21px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .pill{font-family:Outfit;font-size:12px;font-weight:600;background:var(--card2);padding:3px 10px;border-radius:99px;color:var(--muted)}
.banner{margin-top:16px;background:rgba(255,200,97,.12);border:1px solid rgba(255,200,97,.35);border-radius:18px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner .grow{flex:1}
.banner button{background:var(--sun);color:#3a1405;font-weight:700;border-radius:12px;padding:8px 12px;font-size:13px;white-space:nowrap}

.balances{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 14px;text-align:center;overflow:hidden}
.bal::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%)}
.bal>*{position:relative}
.bal .av{width:78px;height:78px;border-radius:50%;background:var(--c);display:block;margin:0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.15);object-fit:cover}
.bal .crown{position:absolute;top:6px;inset-inline-end:10px;font-size:20px}
.bal .name{font-weight:700;margin-top:8px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal .amt{font-family:"Baloo 2";font-weight:800;font-size:24px;line-height:1.1;margin-top:2px;direction:ltr}
.bal .amt.pos{color:var(--green)} .bal .amt.neg{color:var(--red)} .bal .amt.zero{color:var(--muted)}
.bal .hint{font-size:12px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.settle-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.settle-row:first-child{border-top:0}
.settle-row .pair{display:flex;align-items:center;gap:4px;flex-shrink:0;direction:ltr}
.settle-row .pair img{width:42px;height:42px;border-radius:50%;background:var(--c);object-fit:cover}
.settle-row .arrow{color:var(--sun);font-size:18px}
.settle-row .txt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.settle-row .txt b{font-family:"Baloo 2";font-size:19px;display:block}
.ipay{display:inline-block;margin-top:4px;font-size:12px;color:var(--teal);background:rgba(46,230,201,.1);border-radius:8px;padding:3px 8px;direction:ltr}
.btn-paid{background:linear-gradient(135deg,var(--teal),#1bb5a0);color:#032a25;font-weight:700;font-size:13px;padding:9px 12px;border-radius:12px;white-space:nowrap}
.allgood{padding:22px 16px;text-align:center;color:var(--muted)}
.allgood .big{font-size:40px}
.allgood b{color:var(--text);display:block;font-size:17px;margin:4px 0 2px}

.day{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin:18px 4px 8px}
.exp{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;width:100%;text-align:start;
  animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.exp .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--card2);flex-shrink:0}
.exp .mid{flex:1;min-width:0}
.exp .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .m{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.minis{display:inline-flex;direction:ltr}
.minis img{width:20px;height:20px;border-radius:50%;background:var(--c);border:1.5px solid var(--bg2);margin-left:-6px;object-fit:cover}
.minis img:first-child{margin-left:0}
.exp .r{text-align:end;flex-shrink:0}
.exp .a{font-family:"Baloo 2";font-weight:800;font-size:19px}
.exp .e{font-size:11px;color:var(--muted)}
.exp.settle{background:rgba(46,230,201,.08);border-color:rgba(46,230,201,.25)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .big{font-size:46px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:20;
  background:linear-gradient(135deg,var(--sun),var(--coral));color:#3a1405;font-weight:800;font-size:17px;
  padding:16px 28px;border-radius:99px;box-shadow:0 12px 30px rgba(255,122,89,.45),inset 0 1px 0 rgba(255,255,255,.5);display:flex;align-items:center;gap:8px;white-space:nowrap}
.fab span{font-size:24px;line-height:0}
.fab:active{transform:translateX(-50%) scale(.96)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(2,12,18,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;
  background:linear-gradient(180deg,#0f3b4a,#082733);border-radius:28px 28px 0 0;border-top:1px solid var(--line);
  padding:10px 0 calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1.1),visibility 0s .35s}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sheet h3{font-family:var(--head);font-size:22px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.x{font-size:22px;color:var(--muted);padding:4px 8px}
.amount-in{display:flex;align-items:baseline;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;direction:ltr}
.amount-in input{background:none;border:0;outline:0;color:var(--text);font-family:"Baloo 2";font-weight:800;font-size:46px;width:100%;text-align:center;min-width:0}
.amount-in span{color:var(--sun);font-weight:700}
.field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--text);font-size:16px;outline:0;margin-top:10px}
select.field{appearance:none;-webkit-appearance:none}
select.field option{color:#000}
.field:focus,.amount-in:focus-within{border-color:var(--teal)}
.field:disabled,.amount-in input:disabled{opacity:.7}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:18px 2px 8px;display:flex;justify-content:space-between}
.lbl button{color:var(--teal);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--sun);color:#3a1405;border-color:var(--sun)}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.face{text-align:center;font-size:13px;font-weight:600;color:var(--muted);transition:transform .15s;min-width:0}
.face .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face img{width:100%;max-width:74px;aspect-ratio:1;border-radius:50%;background:var(--c);display:block;margin:0 auto 5px;opacity:.35;filter:grayscale(.8);transition:all .2s;border:3px solid transparent;object-fit:cover}
.face.on{color:var(--text)}
.face.on img{opacity:1;filter:none;border-color:#fff;box-shadow:0 0 0 3px var(--c),0 8px 20px rgba(0,0,0,.3)}
.face:active{transform:scale(.93)}
.face:disabled{cursor:default}
.face .lock{font-size:11px;color:var(--muted);display:block}
.preview{margin-top:14px;text-align:center;font-size:14px;color:var(--muted);min-height:20px}
.preview b{color:var(--sun)}
.note{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.save{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--sun),var(--coral));color:#3a1405;font-weight:800;font-size:17px;padding:16px;border-radius:18px}
.save:disabled{opacity:.4}
.ghost{width:100%;margin-top:10px;background:var(--card);border:1px solid var(--line);font-weight:700;padding:14px;border-radius:16px}
.del{width:100%;margin-top:10px;color:var(--red);font-weight:600;padding:12px}

/* full screens */
.full{position:fixed;inset:0;z-index:60;display:none;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
  background:radial-gradient(120% 70% at 50% 0%,#0f5566,var(--bg) 70%) fixed,var(--bg);overflow-y:auto}
.full.on{display:flex}
.full .box{text-align:center;max-width:420px;width:100%;margin:auto 0}
.full h1{font-family:var(--head);font-size:34px;margin:0 0 6px;line-height:1.15}
.full p{color:var(--muted);margin:0 0 20px}
.full .faces{grid-template-columns:repeat(3,1fr);gap:16px}
.full .face img{max-width:96px;opacity:1;filter:none}
.full .face{font-size:16px;color:var(--text)}
.full .face.taken img{opacity:.3;filter:grayscale(1)}
.logo{width:92px;height:92px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.35);margin-bottom:12px}
.bigword{font-family:var(--head);font-weight:800;font-size:52px;line-height:1;margin:0 0 8px}
.bigword span{color:var(--sun)}
.langbtn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);inset-inline-end:16px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600;z-index:2}
.trips{margin-top:22px;text-align:start}
.trips a{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px;color:var(--text);text-decoration:none;font-weight:600}
.steps{text-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px;margin:10px 0 16px}
.steps div{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.steps div:first-child{border-top:0}
.steps b{width:30px;height:30px;border-radius:50%;background:var(--sun);color:#3a1405;display:grid;place-items:center;flex-shrink:0}
.link{color:var(--teal);font-weight:600;padding:10px;font-size:14px;text-decoration:underline}
.warn{color:var(--sun);font-size:13px;margin-top:6px}

/* create form */
.form{text-align:start}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-top:10px;direction:ltr}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:700}
.stepper b{font-family:"Baloo 2";font-size:26px}
.prow{display:flex;align-items:center;gap:10px;margin-top:10px}
.prow .pav{width:54px;height:54px;border-radius:50%;background:var(--c);flex-shrink:0;position:relative}
.prow .pav img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.prow .field{margin-top:0;flex:1;min-width:0}
.prow .cam{width:40px;height:40px;border-radius:12px;background:var(--card2);font-size:18px;flex-shrink:0}
.prow .mebtn{font-size:12px;font-weight:700;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);flex-shrink:0;white-space:nowrap}
.prow .mebtn.on{background:var(--teal);color:#032a25;border-color:var(--teal)}
.linkbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13px;word-break:break-all;direction:ltr;text-align:left;color:var(--muted)}

/* menu */
.mrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow img{width:40px;height:40px;border-radius:50%;background:var(--c);object-fit:cover}
.mrow .grow{flex:1;min-width:0}
.mrow .grow small{display:block;color:var(--muted);font-size:12px}
.mbtn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.mbtn.warn2{color:var(--red)}
.mhead{font-family:var(--head);font-size:18px;margin:18px 0 6px}
.hist{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);z-index:80;
  background:#fff;color:#06202c;font-weight:600;padding:11px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;font-size:14px;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin:0 6px;box-shadow:0 0 8px var(--green)}
.sync.off{background:var(--sun);box-shadow:0 0 8px var(--sun)}
/* face maker */
#faceScreen{z-index:70}
.fm-big{width:150px;height:150px;border-radius:50%;background:var(--c);margin:4px auto 12px;overflow:hidden}
.fm-big img{width:100%;height:100%;display:block}
.fm-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.fm-row::-webkit-scrollbar{display:none}
.fm-opt{flex-shrink:0;width:60px;height:60px;border-radius:50%;background:var(--c);border:3px solid transparent;padding:0;overflow:hidden}
.fm-opt img{width:100%;height:100%;display:block}
.fm-opt.on{border-color:#fff}
.fm-sw{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.fm-sw.on{border-color:#fff}
.spin{display:inline-block;width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--sun);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="hero hide" id="hero">
  <div class="sun"></div>
  <div class="wrap">
    <div class="topbar">
      <div class="brandrow"><button class="homebtn" id="homeBtn">🏠</button><div class="brand" id="brand"></div></div>
      <button class="me" id="meBtn"></button>
    </div>
    <div class="total-wrap">
      <div class="total-label" data-t="tripTotal"></div>
      <div class="total"><span id="total">0</span><small id="cur"></small></div>
      <div class="sub" id="sub"></div>
      <div class="crew" id="crew"></div>
    </div>
  </div>
  <div class="waves">
    <svg viewBox="0 0 1200 60" preserveAspectRatio="none"><path fill="rgba(46,230,201,.12)" d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 V60 H0Z"/><path fill="rgba(46,230,201,.08)" d="M0 40 Q150 15 300 40 T600 40 T900 40 T1200 40 V60 H0Z"/></svg>
  </div>
</header>

<main class="wrap hide" id="main">
  <div id="rescue"></div>
  <div id="tip"></div>
  <div id="expiry"></div>
  <section>
    <h2 data-t="whoOwes"></h2>
    <div class="balances" id="balances"></div>
  </section>
  <section>
    <h2><span data-t="settleUp"></span> <span class="pill" id="settleCount"></span></h2>
    <div class="card" id="settle"></div>
  </section>
  <section>
    <h2><span data-t="expenses"></span> <span class="pill" id="expCount"></span></h2>
    <div id="list"></div>
  </section>
</main>

<button class="fab hide" id="addBtn"><span>+</span> <em style="font-style:normal" data-t="addExpense"></em></button>

<div class="overlay" id="overlay"></div>

<!-- expense sheet -->
<div class="sheet" id="sheet">
  <div class="wrap">
    <div class="grab"></div>
    <h3><span id="sheetTitle"></span><button class="x" data-close>✕</button></h3>
    <div class="amount-in"><input id="fAmount" inputmode="decimal" placeholder="0" autocomplete="off"><span id="fCur"></span></div>
    <input class="field" id="fDesc" maxlength="60" autocomplete="off">

const IPAY_LINK_RE = /^https:\/\/ipn\.eg\/[A-Za-z0-9\/_.-]{1,90}$/;

/* ---------- maths ---------- */
function live() { return items.filter(x => !x.deleted); }
function computeBalances() {
  const net = Object.fromEntries(order.map(id => [id, 0]));
  const paid = Object.fromEntries(order.map(id => [id, 0]));
  let total = 0;
  for (const x of live()) {
    const split = (x.split || []).filter(id => id in net);
    if (!(x.paidBy in net) || !split.length || !(x.amount > 0)) continue;
    net[x.paidBy] += x.amount;
    split.forEach(id => net[id] -= x.amount / split.length);
    if (x.type !== "settle") { total += x.amount; paid[x.paidBy] += x.amount; }
  }
  return { net, paid, total };
}
// Fewest transfers: repeatedly match the biggest debtor with the biggest creditor.
function settlements(net) {
  const cred = [], debt = [];
  for (const [id, v] of Object.entries(net)) {
    if (v > 0.5) cred.push({ id, v }); else if (v < -0.5) debt.push({ id, v: -v });
  }
  const out = [];
  while (cred.length && debt.length) {
    cred.sort((a, b) => b.v - a.v); debt.sort((a, b) => b.v - a.v);
    const c = cred[0], d = debt[0], amt = Math.min(c.v, d.v);
    out.push({ from: d.id, to: c.id, amount: amt });
    c.v -= amt; d.v -= amt;
    if (c.v <= 0.5) cred.shift();
    if (d.v <= 0.5) debt.shift();
  }
  return out;
}
const tsMs = (v) => v?.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0);

  const last = tsMs(trip.lastActivity) || Date.now(), born = tsMs(trip.createdAt) || Date.now();
  return Math.min(LIFETIME_DAYS - (Date.now() - last) / 86400000, MAX_TRIP_DAYS - (Date.now() - born) / 86400000);
}
function summaryText() {
  const { net, total } = computeBalances();
  const cur = trip.currency;
  const lines = [`Shella · ${trip.name}`, `${t("total")}: ${fmt(total)} ${cur}`, ""];
  const plan = settlements(net);
  if (!plan.length) lines.push(t("allSquare"));
  plan.forEach(s => {
    const h = cleanIpay(people[s.to]?.instapay);
    lines.push(`${t("pays", { a: nameOf(s.from), b: nameOf(s.to) })}: ${fmt(s.amount)} ${cur}${h ? ` (InstaPay ${h})` : ""}`);
  });

}

function dayLabel(ms) {
  if (!ms) return t("justNow");
  const d = new Date(ms), n = new Date();
  const k = (x) => x.toDateString();
  if (k(d) === k(n)) return t("today");
  n.setDate(n.getDate() - 1);
  if (k(d) === k(n)) return t("yesterday");
  return d.toLocaleDateString(lang === "ar" ? "ar-EG" : "en-GB", { weekday: "short", day: "numeric", month: "short" });
}
function ago(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return t("agoNow");
  if (m < 60) return t("agoM", { n: m });
  if (m < 1440) return t("agoH", { n: Math.round(m / 60) });
  return t("agoD", { n: Math.round(m / 1440) });
}
function animateTotal(to) {
  const from = shownTotal, t0 = performance.now(), dur = firstLoad ? 900 : 600;
  shownTotal = to;
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    $("total").textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

    batch.commit().then(() => drawMenu()).catch(() => toast(t("saveFail")));
    $("newPerson").value = "";
  }

/* ---------- photos (shrunk on the phone, never the original) ---------- */
function pickPhoto(cb) {
  const input = $("photoIn");
  input.value = "";
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const S = 144, c = document.createElement("canvas"); c.width = c.height = S;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
      let q = 0.8, data = c.toDataURL("image/jpeg", q);
      while (data.length > 55000 && q > 0.3) { q -= 0.15; data = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(img.src);
      cb({ k: "photo", v: data });
    };
    img.src = URL.createObjectURL(f);
  };
  input.click();
}

    list.map(x => `<a href="#t=${encodeURIComponent(x.id)}" data-trip="${esc(x.id)}">${esc(x.name)}<span>›</span></a>`).join("") : "";
  show("homeScreen");
}
function openPasted() {
  const v = $("pasteIn").value.trim();
  const m = v.match(/[#?&]t=([A-Za-z0-9_-]{20,40})(?![A-Za-z0-9_-])/) || v.match(/^([A-Za-z0-9_-]{20,40})$/);
  if (!m) return toast(t("badLink"));
  location.href = tripLink(m[1]); location.reload();
}
$("pasteGo").addEventListener("click", openPasted);
$("pasteIn").addEventListener("keydown", (e) => { if (e.key === "Enter") openPasted(); });
$("myTrips").addEventListener("click", (e) => {
  const a = e.target.closest("[data-trip]"); if (!a) return;
  e.preventDefault(); location.href = tripLink(a.dataset.trip); location.reload();
});

let rows = [], meIdx = 0;
function resetCreate() {
  rows = Array.from({ length: 4 }, () => ({ name: "", avatar: newDice() }));
  meIdx = 0;
  $("cName").value = "";
  $("cCur").innerHTML = CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join("");
  drawRows();
}
function drawRows() {
  $("cCount").textContent = rows.length;
  $("cRows").innerHTML = rows.map((r, i) => `<div class="prow" data-i="${i}">
    <button class="pav" data-act="face" style="--c:${COLORS[i % COLORS.length]}"><img src="${esc(avatarSrc(r.avatar))}" alt=""></button>
    <input class="field" data-act="name" maxlength="24" autocomplete="off" placeholder="${esc(t("namePh"))} ${i + 1}" value="${esc(r.name)}">
    <button class="mebtn${i === meIdx ? " on" : ""}" data-act="me">${t("thisIsMe")}</button></div>`).join("");
}
$("cRows").addEventListener("input", (e) => {
  const row = e.target.closest(".prow"); if (row && e.target.dataset.act === "name") rows[+row.dataset.i].name = e.target.value;
});
$("cRows").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"), row = e.target.closest(".prow"); if (!b || !row) return;
  const i = +row.dataset.i;
  if (b.dataset.act === "face") openFaceMaker(rows[i].avatar, COLORS[i % COLORS.length], a => { rows[i].avatar = a; drawRows(); });
  else if (b.dataset.act === "me") { meIdx = i; drawRows(); }
});
$("cMinus").addEventListener("click", () => { if (rows.length > 2) { rows.pop(); if (meIdx >= rows.length) meIdx = 0; drawRows(); } });
$("cPlus").addEventListener("click", () => { if (rows.length < MAX_PEOPLE) { rows.push({ name: "", avatar: newDice() }); drawRows(); } });
$("createBtn").addEventListener("click", () => { resetCreate(); show("createScreen"); });
$("cBack").addEventListener("click", showHome);
$("cGo").addEventListener("click", async () => {
  const name = $("cName").value.trim().slice(0, 40);
  const names = rows.map(r => r.name.trim().slice(0, 24));
  if (!name) return toast(t("needTripName"));
  if (names.some(n => !n)) return toast(t("needNames"));
  if (new Set(names.map(n => n.toLowerCase())).size !== names.length) return toast(t("dupNames"));
  if (!navigator.onLine) return toast(t("needNet"));
  const id = randId(18);
  const tref = doc(db, "trips", id);
  const batch = writeBatch(db);
  batch.set(tref, { name, currency: $("cCur").value, maker: uid, open: true, createdAt: serverTimestamp(), lastActivity: serverTimestamp() });
  rows.forEach((r, i) => batch.set(doc(db, "trips", id, "people", "p" + (i + 1)),
    { name: names[i], avatar: r.avatar, instapay: "", uid: i === meIdx ? uid : null }));
  batch.set(doc(db, "trips", id, "members", uid), { person: "p" + (meIdx + 1) });
  const btn = $("cGo"); btn.disabled = true; btn.textContent = t("creating");
  try {
    await timeout(batch.commit(), 20000);
    const day = new Date().toISOString().slice(0, 10);
    setDoc(doc(db, "stats", day), { count: increment(1) }, { merge: true }).catch(() => {});
    let list = [];
    try { list = JSON.parse(store.get("myTrips") || "[]"); } catch {}
    store.set("myTrips", JSON.stringify([{ id, name }, ...list].slice(0, 12)));
    shareTrip(id, name, true);
  } catch { toast(t("saveFail")); }
  finally { btn.disabled = false; btn.textContent = t("createBtn"); }
});
function shareTrip(id, name, fresh = false) {
  const link = tripLink(id);
  closeLayers(); hideApp();
  $("shareLink").textContent = link;
  $("shareWA").onclick = () => { window.open("https://wa.me/?text=" + encodeURIComponent(t("waText", { name, link })), "_blank"); };
  $("shareCopy").onclick = () => copy(link);
  $("shareOpen").onclick = () => { if (fresh || !TRIP) { location.href = link; location.reload(); } else { showApp(); render(); } };
  show("shareScreen");
  if (fresh) window.confetti?.({ particleCount: 120, spread: 90, origin: { y: .6 } });
}

/* ---------- face maker ---------- */
let fm = null, fmDone = null;
function openFaceMaker(current, color, done) {
  fm = faceOpts(current?.k === "face" ? current.v : "") || { skin: 2, hair: 0, top: 1, beard: 0, glasses: 0, mood: 0 };
  fmDone = done;
  $("faceScreen").style.setProperty("--c", color);
  $("fmStatus").textContent = "";
  drawFace();
  $("faceScreen").classList.add("on"); $("faceScreen").scrollTop = 0;
}
function closeFaceMaker() { $("faceScreen").classList.remove("on"); fmDone = null; }
function drawFace() {
  $("fmBig").innerHTML = `<img src="${faceSvg(fm)}" alt="">`;
  document.querySelectorAll("[data-fm]").forEach(row => {
    const k = row.dataset.fm;
    row.innerHTML = FM[k].map((v, i) => (k === "skin" || k === "hair")
      ? `<button class="fm-sw${fm[k] === i ? " on" : ""}" data-k="${k}" data-i="${i}" style="background:#${v}"></button>`
      : `<button class="fm-opt${fm[k] === i ? " on" : ""}" data-k="${k}" data-i="${i}"><img src="${faceSvg({ ...fm, [k]: i })}" alt="" loading="lazy"></button>`).join("");
  });
}
$("faceScreen").addEventListener("click", (e) => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  fm[b.dataset.k] = +b.dataset.i; drawFace();
});
const finishFace = (a) => { const cb = fmDone; closeFaceMaker(); cb?.(a); };
$("fmSave").addEventListener("click", () => finishFace({ k: "face", v: faceCode(fm) }));
$("fmBack").addEventListener("click", closeFaceMaker);
$("fmDice").addEventListener("click", () => finishFace(newDice()));
$("fmPhoto").addEventListener("click", () => pickPhoto(a => finishFace(a)));
$("fmCopy").addEventListener("click", () => pickFile(copyColours));

// Photo -> skin and hair colour, on this phone only (MediaPipe face landmarks; the photo is never uploaded).
let landmarker = null;
async function getLandmarker() {
  if (landmarker) return landmarker;
  $("fmStatus").textContent = t("fmLoading");
  const v = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
  const files = await v.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await v.FaceLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
    runningMode: "IMAGE", numFaces: 1,
  });
  return landmarker;
}
function lab([r, g, b]) {
  const f = (c) => { c /= 255; return c > 0.04045 ? ((c + 0.055) / 1.055) ** 2.4 : c / 12.92; };
  const [R, G, B] = [f(r), f(g), f(b)];
  const h = (x) => x > 0.008856 ? Math.cbrt(x) : 7.787 * x + 16 / 116;
  const x = h((R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047), y = h(R * 0.2126 + G * 0.7152 + B * 0.0722), z = h((R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
function nearestIdx(rgb, palette) {
  const a = lab(rgb); let best = 0, bd = Infinity;
  palette.forEach((p, i) => {
    const b = lab([0, 2, 4].map(j => parseInt(p.slice(j, j + 2), 16)));
    const d = (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2; if (d < bd) { bd = d; best = i; }
  });
  return best;
}
function sampleMedian(ctx, x, y, r) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const x0 = Math.max(0, Math.round(x - r)), y0 = Math.max(0, Math.round(y - r));
  const w = Math.min(W - x0, Math.round(2 * r)), h = Math.min(H - y0, Math.round(2 * r));
  if (w < 1 || h < 1) return null;
  const d = ctx.getImageData(x0, y0, w, h).data, px = [];
  for (let i = 0; i < d.length; i += 4) px.push([d[i], d[i + 1], d[i + 2]]);
  const med = (k) => px.map(p => p[k]).sort((a, b) => a - b)[px.length >> 1];
  return [med(0), med(1), med(2)];
}
function pickFile(cb) {
  const input = $("photoIn");
  input.value = "";
  input.onchange = () => { const f = input.files[0]; if (f) cb(f); };
  input.click();
}
async function copyColours(f) {
  const url = URL.createObjectURL(f);
  try {
    const im = new Image(); im.src = url; await im.decode();
    const lm = await getLandmarker();
    $("fmStatus").textContent = t("fmLooking");
    const S = Math.min(1, 1024 / Math.max(im.width, im.height));
    const c = document.createElement("canvas"); c.width = Math.round(im.width * S); c.height = Math.round(im.height * S);
    const ctx = c.getContext("2d", { willReadFrequently: true }); ctx.drawImage(im, 0, 0, c.width, c.height);
    const pts = lm.detect(c).faceLandmarks?.[0];
    if (!pts) { $("fmStatus").textContent = t("fmNoFace"); return; }
    const P = (i) => [pts[i].x * c.width, pts[i].y * c.height];
    const top = P(10), chin = P(152), faceH = Math.hypot(chin[0] - top[0], chin[1] - top[1]), r = faceH * 0.04;
    // Skin: both cheeks and the forehead; the middle value wins, so a shadow or shine on one side doesn't.
    const skins = [205, 425, 151].map(i => sampleMedian(ctx, ...P(i), r)).filter(Boolean);
    const skin = [0, 1, 2].map(k => skins.map(s => s[k]).sort((a, b) => a - b)[skins.length >> 1]);
    // Hair: just above the forehead, along the face's own "up".
    const ux = (top[0] - chin[0]) / faceH, uy = (top[1] - chin[1]) / faceH;
    const hair = sampleMedian(ctx, top[0] + ux * faceH * 0.1, top[1] + uy * faceH * 0.1, r);
    fm.skin = nearestIdx(skin, FM.skin);
    // Hair that looks like skin = bald, shaved or covered: keep the current hair colour.
    if (hair && Math.abs(lab(hair)[0] - lab(skin)[0]) > 12) fm.hair = nearestIdx(hair, FM.hair);
    drawFace();
    $("fmStatus").textContent = t("fmDone");
  } catch (err) {
    $("fmStatus").textContent = t("fmFail");
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- install gate (iPhone browser tab) ---------- */
function showInstall() {
  $("installWA").classList.toggle("hide", !inApp);
  show("installScreen");
}
// "Continue in the browser" is remembered per trip, so a new trip link shows the steps again.
// The home page skips the steps once the person has chosen the browser for any trip.
function skippedInstall() {
  if (TRIP) return store.get("skipInstall:" + TRIP) === "1";
  try { return Object.keys(localStorage).some(k => k.startsWith("skipInstall")); } catch { return false; }
}
$("installSkip").addEventListener("click", () => { store.set("skipInstall:" + (TRIP || "home"), "1"); boot(); });

/* ---------- fx ---------- */
function boom() {
  toast(t("allSquareBoom"));
  const end = Date.now() + 1500;
  (function f() {
    window.confetti?.({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0 } });
    window.confetti?.({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1 } });
    if (Date.now() < end) requestAnimationFrame(f);
  })();
}
addEventListener("online", () => render()); addEventListener("offline", () => render());
addEventListener("hashchange", () => location.reload());

// Offline shell: lets the home-screen app open with no signal (expenses already sync later via the Firestore cache).
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- boot ---------- */
let booted = false;
async function boot() {
  applyLang();
  if (!FIREBASE_CONFIG) return msg("🛠️", t("setupTitle"), t("setupBody"), false);
  // On iPhone the home-screen app has its own storage, so the name must be claimed inside it.
  if (isIOS && !standalone && !skippedInstall()) return showInstall();
  if (!booted) { initFirebase(); booted = true; }
  msg('<span class="spin"></span>', t("loading"), "", false);
  try { await ensureAuth(); }
  catch {
    msg("📡", t("dbErr"), t("needNet"), false);
    const b = $("msgAct"); b.textContent = t("retry"); b.classList.remove("hide"); b.onclick = () => location.reload();
    return;
  }
  if (!TRIP) return showHome();
  if (!/^[A-Za-z0-9_-]{20,40}$/.test(TRIP)) return msg("🧭", t("notFoundTitle"), t("notFoundBody"));
  openTrip();
}
boot();
